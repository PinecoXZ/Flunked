<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Drop Shadow -->
  <ellipse cx="100" cy="184" rx="55" ry="10" fill="#000000" opacity="0.15" />
  
  <!-- Duck Feet -->
  <path d="M 72 170 L 60 182 L 80 182 Z" fill="#FF8A00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 128 170 L 120 182 L 140 182 Z" fill="#FF8A00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Duck Body -->
  <path d="M 55 125 C 45 155 70 176 100 176 C 135 176 155 155 150 125 C 145 105 138 98 130 92 C 122 86 112 85 100 85 C 80 85 62 100 55 125 Z" 
        fill="#FFE600" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Left Wing (holding tea) -->
  <path d="M 52 118 C 38 128 42 152 64 146 C 68 135 60 122 52 118 Z" 
        fill="#FFD000" stroke="#000000" stroke-width="3" stroke-linejoin="round" />

  <!-- Right Wing -->
  <path d="M 148 118 C 162 128 158 152 136 146 C 132 135 140 122 148 118 Z" 
        fill="#FFD000" stroke="#000000" stroke-width="3" stroke-linejoin="round" />

  <!-- Duck Head -->
  <circle cx="100" cy="68" r="42" fill="#FFE600" stroke="#000000" stroke-width="3.5" />

  <!-- Beak -->
  <path d="M 80 72 C 80 62 120 62 120 72 C 120 84 80 84 80 72 Z" 
        fill="#FF8A00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
  <line x1="84" y1="73" x2="116" y2="73" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />

  <!-- Nostrils -->
  <circle cx="94" cy="69" r="1.5" fill="#000000" />
  <circle cx="106" cy="69" r="1.5" fill="#000000" />

  <!-- Black Retro Sunglasses -->
  <g id="black-sunglasses">
    <!-- Left Lens -->
    <rect x="68" y="46" width="28" height="20" rx="4" fill="#151515" stroke="#000000" stroke-width="3.5" />
    <path d="M 72 50 L 76 50 L 72 62" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    
    <!-- Bridge -->
    <rect x="94" y="52" width="12" height="4.5" fill="#000000" />
    
    <!-- Right Lens -->
    <rect x="104" y="46" width="28" height="20" rx="4" fill="#151515" stroke="#000000" stroke-width="3.5" />
    <path d="M 108 50 L 112 50 L 108 62" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />

    <!-- Frames / Temples -->
    <line x1="68" y1="52" x2="56" y2="56" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
    <line x1="132" y1="52" x2="144" y2="56" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Cutting Chai Glass in Hand -->
  <g id="chai-glass">
    <path d="M 40 128 L 54 128 L 51 152 L 43 152 Z" fill="#C89D7C" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Tea liquid -->
    <path d="M 42 133 L 52 133 L 50 150 L 44 150 Z" fill="#9C5B28" />
    <!-- Glass rim & facets -->
    <line x1="39" y1="128" x2="55" y2="128" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <line x1="47" y1="133" x2="47" y2="150" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 44 123 Q 46 118 43 114" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 49 122 Q 52 117 48 112" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- 75% Badge on Chest -->
  <rect x="83" y="122" width="34" height="18" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="100" y="135" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle" fill="#000000">75%</text>
</svg>
